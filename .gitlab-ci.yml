# Air-gapped: set REGISTRY_MIRROR (with trailing slash), UV_INDEX_URL, NPM_CONFIG_REGISTRY and
# (optionally) KUBECONFORM_SCHEMA_LOCATION as CI/CD variables. HELM_IMAGE/KUBECONFORM_IMAGE may be overridden too.
stages: [lint, test, terraform, build]

variables:
  REGISTRY_MIRROR: ""
  UV_INDEX_URL: "https://pypi.org/simple"
  NPM_CONFIG_REGISTRY: ""
  # Empty: ONLINE upstream schemas (GitHub) + -ignore-missing-schemas (CRDs skipped). Air-gapped runners MUST set this
  # to a mirror that also carries the CRD catalog.
  # Set (e.g. https://mirror/schemas/{{.NormalizedKubernetesVersion}}/{{.ResourceKind}}.json) to use it for k8s AND CRDs.
  KUBECONFORM_SCHEMA_LOCATION: ""
  HELM_IMAGE: "${REGISTRY_MIRROR}alpine/helm:3.17.3"
  KUBECONFORM_IMAGE: "${REGISTRY_MIRROR}ghcr.io/yannh/kubeconform:v0.6.7-alpine"
  MINIO_IMAGE: "${REGISTRY_MIRROR}bitnamilegacy/minio:2025.5.24"
  TERRAFORM_IMAGE: "${REGISTRY_MIRROR}hashicorp/terraform:1.15.8"
  KIND_E2E_IMAGE: ""   # REQUIRED for iac-kind-e2e (the job fails fast when empty): bash 4+, docker CLI, terraform, curl, jq, tar, openssl, sha256sum
  ELASTICSEARCH_IMAGE: "${REGISTRY_MIRROR}docker.elastic.co/elasticsearch/elasticsearch:9.5.6"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

.backend:
  image: ${REGISTRY_MIRROR}python:3.12-slim
  before_script:
    - pip install --no-cache-dir --index-url "$UV_INDEX_URL" uv==0.10.4
    - cd backend
    # Hash-pinned deps from the mirror (uv.lock URLs would bypass it); no `uv run`, which re-syncs from the lock.
    - uv export --frozen --no-emit-project --format requirements-txt -o /tmp/req.txt
    - uv venv /tmp/venv
    - uv pip install --python /tmp/venv --require-hashes --index-url "$UV_INDEX_URL" -r /tmp/req.txt
    - uv pip install --python /tmp/venv --no-deps --index-url "$UV_INDEX_URL" -e .
    - export PATH=/tmp/venv/bin:$PATH

lint:
  extends: .backend
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

test:
  extends: .backend
  stage: test
  services:
    - name: ${REGISTRY_MIRROR}postgres:16
      alias: postgres
    - name: $MINIO_IMAGE
      alias: minio
  variables:
    POSTGRES_USER: roracle
    POSTGRES_PASSWORD: roracle
    POSTGRES_DB: roracle_test
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    ROR_DATABASE_URL: postgresql+psycopg://roracle:roracle@postgres:5432/roracle_test
    ROR_S3_ENDPOINT: http://minio:9000
    ROR_S3_ACCESS_KEY: minioadmin
    ROR_S3_SECRET_KEY: minioadmin
    ROR_OIDC_ISSUER: http://keycloak.invalid/realms/roracle
    ROR_OIDC_JWKS_URL: http://keycloak.invalid/realms/roracle/protocol/openid-connect/certs
  script:
    - pytest -q -m "not integration and not e2e" --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

# Retrieval-quality gate: synthetic fixture (32 docs, 4 principals) through the real ES/Postgres paths with offline
# models; fails on any ACL violation (incl. ES-only) or a metric under tests/eval/floors.json. No GPU, no network.
eval:
  extends: .backend
  stage: test
  services:
    - name: ${REGISTRY_MIRROR}postgres:16
      alias: postgres
    - name: $ELASTICSEARCH_IMAGE
      alias: elasticsearch
      command: ["bin/elasticsearch", "-Ediscovery.type=single-node", "-Expack.security.enabled=false"]
      variables:
        ES_JAVA_OPTS: "-Xms512m -Xmx512m"
  variables:
    POSTGRES_USER: roracle
    POSTGRES_PASSWORD: roracle
    POSTGRES_DB: roracle_eval
    ROR_DATABASE_URL: postgresql+psycopg://roracle:roracle@postgres:5432/roracle_eval
    ROR_ELASTIC_URL: http://elasticsearch:9200
    ROR_S3_ENDPOINT: http://minio.invalid:9000  # required settings; `eval ci` never touches object storage
    ROR_S3_ACCESS_KEY: unused
    ROR_S3_SECRET_KEY: unused
    ROR_OIDC_ISSUER: http://keycloak.invalid/realms/roracle
    ROR_OIDC_JWKS_URL: http://keycloak.invalid/realms/roracle/protocol/openid-connect/certs
  script:
    - python -m roracle migrate --wait 60 && python -m roracle eval ci --fixture tests/eval/fixture.yaml --floors tests/eval/floors.json --out eval-report.json
  artifacts:
    when: always
    paths: [backend/eval-report.json]

# Budget regression gate (Task 10.13): the `ci` profile of `roracle perf suite` (20k docs / 20k chunks, real API process,
# fake models with fixed latency, budgets x1.5 for shared runners; docs/perf/budgets.yaml). Nightly (pipeline schedule),
# manual from the web UI, or on demand in a merge request. The full-scale numbers live in docs/perf/report-*.md.
perf:
  extends: .backend
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  timeout: 40m
  retry: {max: 1, when: script_failure}  # one retry on a budget miss: shared runners are noisy
  services:
    - name: ${REGISTRY_MIRROR}postgres:16
      alias: postgres
      command: ["postgres", "-c", "max_connections=200"]
    - name: $ELASTICSEARCH_IMAGE
      alias: elasticsearch
      command: ["bin/elasticsearch", "-Ediscovery.type=single-node", "-Expack.security.enabled=false"]
      variables:
        ES_JAVA_OPTS: "-Xms1g -Xmx1g"
  variables:
    POSTGRES_USER: roracle
    POSTGRES_PASSWORD: roracle
    POSTGRES_DB: roracle_perf  # the perf tooling refuses any database whose name lacks "perf"
    ROR_DATABASE_URL: postgresql+psycopg://roracle:roracle@postgres:5432/roracle_perf
    ROR_ELASTIC_URL: http://elasticsearch:9200
    ROR_S3_ENDPOINT: http://minio.invalid:9000
    ROR_S3_ACCESS_KEY: unused
    ROR_S3_SECRET_KEY: unused
    ROR_OIDC_ISSUER: http://keycloak.invalid/realms/roracle
    ROR_OIDC_JWKS_URL: http://keycloak.invalid/realms/roracle/protocol/openid-connect/certs
  script:
    - python -m roracle migrate --wait 60
    - python -m roracle perf suite --profile ci --url "$ROR_DATABASE_URL" --es-url "$ROR_ELASTIC_URL" --budget ../docs/perf/budgets.yaml --out perf-results.json
  artifacts:
    when: always
    paths: [backend/perf-results.json]

build:
  stage: build
  image:
    name: ${REGISTRY_MIRROR}gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      DEST="--destination $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
      [ -n "$CI_COMMIT_TAG" ] && DEST="$DEST --destination $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE/backend:$(cat VERSION)"
      [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && DEST="--no-push"
      mkdir -p /kaniko/.docker
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile backend/Dockerfile \
        --build-arg REGISTRY_MIRROR="$REGISTRY_MIRROR" --build-arg UV_INDEX_URL="$UV_INDEX_URL" \
        --build-arg VERSION="$(cat VERSION)" $DEST

.frontend-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, .gitlab-ci.yml]
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

.helm-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [deploy/**/*, VERSION, scripts/check-version.sh, .gitlab-ci.yml]
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

frontend:
  extends: .frontend-rules
  stage: test
  image: ${REGISTRY_MIRROR}node:22-slim
  variables:
    CI: "1"
    npm_config_store_dir: $CI_PROJECT_DIR/.pnpm-store
  cache:
    key: {files: [frontend/pnpm-lock.yaml]}
    paths: [.pnpm-store]
  script:
    - cd frontend
    - '[ -z "$NPM_CONFIG_REGISTRY" ] || export COREPACK_NPM_REGISTRY="$NPM_CONFIG_REGISTRY"'
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit   # lint: no eslint configured
    - pnpm exec vitest run
    - pnpm build
    - pnpm check:dist
    - pnpm check:size   # gzip bundle budget (scripts/check-size.mjs)

# One tool per image (no downloads in air-gap): helm+python here, kubeconform in its own job via artifacts.
helm:
  extends: .helm-rules
  stage: lint
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  script:
    - sh scripts/check-version.sh
    - cd deploy/helm/roracle
    - helm lint --strict . -f ci/min-values.yaml
    - helm lint --strict . -f ci/full-values.yaml
    # the connection-budget guard must fail the render, and for that reason (not an unrelated error)
    - |
      if helm template r . -f ci/full-values.yaml --set config.ROR_DB_POOL_SIZE=40 >/dev/null 2>/tmp/budget-err.txt; then echo "connection budget guard did not fire"; exit 1; fi
      grep -q "connection budget" /tmp/budget-err.txt
    - mkdir -p ../../../rendered
    - helm template r . -f ci/min-values.yaml --set observability.grafanaDashboard.enabled=true > ../../../rendered/min.yaml
    - helm template r . -f ci/full-values.yaml --set observability.grafanaDashboard.enabled=true > ../../../rendered/full.yaml
  artifacts:
    paths: [rendered/]
    expire_in: 1 day

assert-render:
  extends: .helm-rules
  stage: test
  image: ${REGISTRY_MIRROR}python:3.12-slim
  needs: [helm]
  script:
    - pip install --no-cache-dir --index-url "$UV_INDEX_URL" pyyaml==6.0.3
    - sh deploy/helm/roracle/ci/assert-render.sh rendered/full.yaml

kubeconform:
  extends: .helm-rules
  stage: test
  image:
    name: $KUBECONFORM_IMAGE
    entrypoint: [""]
  needs: [helm]
  script:
    - |
      if [ -n "$KUBECONFORM_SCHEMA_LOCATION" ]; then SCHEMA="-schema-location $KUBECONFORM_SCHEMA_LOCATION"; else SCHEMA="-schema-location default -ignore-missing-schemas"; fi
      for f in rendered/min.yaml rendered/full.yaml; do /kubeconform -strict -summary $SCHEMA "$f"; done

# Air-gapped: providers (hashicorp/kubernetes, hashicorp/helm) must come from a mirror. Provide a CI/CD *file* variable
# TF_CLI_CONFIG_FILE (Terraform CLI config with a filesystem/network provider_installation mirror).
terraform:
  extends: .helm-rules
  stage: terraform
  image:
    name: $TERRAFORM_IMAGE
    entrypoint: [""]
  script:
    - cd deploy/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

# Manual apply rehearsal on kind (real cluster, local registry as air-gap mirror). Needs a PRIVILEGED runner with Docker-in-Docker
# (it starts kind node containers and registry:2), internet for the first run (kind/kubectl/helm, upstream images) and ~8 GB RAM.
# Not part of the default pipeline: trigger it manually. KIND_E2E_IMAGE must contain bash 4+, docker CLI, terraform, curl, jq, tar, openssl, sha256sum.
iac-kind-e2e:
  stage: terraform
  rules:
    - when: manual
      allow_failure: true
  image: ${KIND_E2E_IMAGE}
  services:
    # dockerd listens on loopback only (the entrypoint would otherwise bind an unauthenticated tcp://0.0.0.0:2375 on the pod IP)
    - name: ${REGISTRY_MIRROR}docker:27-dind
      alias: docker
      command: ["dockerd", "--host=tcp://127.0.0.1:2375", "--host=unix:///var/run/docker.sock"]
  variables:
    # The script reaches the registry (127.0.0.1:5055) and the kind API server on localhost: the dind service must share the
    # job's network namespace (Kubernetes executor, privileged pod). A Docker executor needs the host docker.sock instead.
    DOCKER_HOST: tcp://127.0.0.1:2375
    DOCKER_TLS_CERTDIR: ""
  timeout: 1h
  script:
    - test -n "$KIND_E2E_IMAGE" || { echo "set KIND_E2E_IMAGE (see variables)"; exit 1; }
    - deploy/terraform/test/kind-e2e.sh all
  after_script:
    - deploy/terraform/test/kind-e2e.sh down || true

build-web:
  stage: build
  image:
    name: ${REGISTRY_MIRROR}gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      V="$(cat VERSION)"
      DEST="--destination $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
      [ -n "$CI_COMMIT_TAG" ] && DEST="$DEST --destination $CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE/web:$V"
      [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && DEST="--no-push"
      mkdir -p /kaniko/.docker
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile frontend/Dockerfile \
        --build-arg REGISTRY_MIRROR="$REGISTRY_MIRROR" --build-arg NPM_CONFIG_REGISTRY="$NPM_CONFIG_REGISTRY" \
        --build-arg VERSION="$V" $DEST
