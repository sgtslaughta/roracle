# rOracle docs site. Built offline by scripts/docs/build-site.sh into ./site (gitignored), served at /docs/.
[project]
site_name = "rOracle docs"
site_description = "rOracle: air-gapped research RAG. User, admin, operator and developer documentation."
docs_dir = "docs"
site_dir = "site"
# Plans/prototype are not reader docs. docs/prototype is a design mock-up (single HTML with inlined images).
exclude_docs = """
superpowers/
prototype/
"""
extra_css = ["stylesheets/roracle.css"]
# Vendored mermaid (no CDN). Zensical's bundle only fetches unpkg.com/mermaid when the global is undefined.
extra_javascript = ["assets/js/mermaid.min.js"]

[project.extra]
generator = false

[project.theme]
language = "en"
font = false  # no Google Fonts; @font-face is self-hosted in roracle.css
logo = "assets/logo.png"
favicon = "assets/favicon.ico"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
