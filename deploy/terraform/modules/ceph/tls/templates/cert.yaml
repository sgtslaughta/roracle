{{- $ca := eq .Values.issuer "self-signed-ca" }}
{{- if $ca }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: {{ .Values.secretName }}-selfsigned}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: {{ .Values.secretName }}-ca}
spec:
  isCA: true
  commonName: {{ .Values.secretName }}-ca
  secretName: {{ .Values.secretName }}-ca
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: {{ .Values.secretName }}-selfsigned, kind: Issuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: {{ .Values.secretName }}-ca}
spec: {ca: {secretName: {{ .Values.secretName }}-ca}}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: {{ .Values.secretName }}}
spec:
  secretName: {{ .Values.secretName }}
  dnsNames: {{ toJson .Values.dnsNames }}
  usages: [server auth]
  issuerRef:
    name: {{ ternary (printf "%s-ca" .Values.secretName) .Values.issuer $ca }}
    kind: {{ ternary "Issuer" "ClusterIssuer" $ca }}
    group: cert-manager.io
