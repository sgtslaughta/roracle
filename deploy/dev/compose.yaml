name: roracle
services:
  postgres:
    image: ${REGISTRY_MIRROR:-}postgres:16
    environment:
      POSTGRES_USER: roracle
      POSTGRES_PASSWORD: roracle
      POSTGRES_DB: roracle
    ports: ["${ROR_PG_PORT:-55433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # init.sql only runs on a fresh volume; use `docker compose down -v` to recreate.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roracle"]
      interval: 5s
      retries: 20
  # Docker Hub minio/* and quay.io/minio/* are no longer pullable; bitnamilegacy/minio ships server + mc.
  minio:
    image: ${REGISTRY_MIRROR:-}bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
  minio-init:
    image: ${REGISTRY_MIRROR:-}bitnamilegacy/minio:2025.5.24
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/roracle"
  keycloak:
    image: ${REGISTRY_MIRROR:-}quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak image has no curl; probe via bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/roracle/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      retries: 40
  elasticsearch:
    image: ${REGISTRY_MIRROR:-}docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'"]
      interval: 5s
      retries: 40
  docling:
    image: ${REGISTRY_MIRROR:-}quay.io/docling-project/docling-serve-cpu:latest
    environment:
      # takes effect on next restart
      DOCLING_SERVE_MAX_NUM_PAGES: "2000"
      DOCLING_SERVE_MAX_FILE_SIZE: "629145600"  # 600 MB
    ports: ["5001:5001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health"]
      interval: 10s
      retries: 30
      start_period: 60s
  grobid:
    profiles: [full]
    image: ${REGISTRY_MIRROR:-}lfoppiano/grobid:0.8.1
    ports: ["8070:8070"]
  gotenberg:
    profiles: [full]
    image: ${REGISTRY_MIRROR:-}gotenberg/gotenberg:8.20.1
    # LibreOffice follows external links in uploads: isolate it (own network, no downloads/webhooks)
    command:
      - gotenberg
      - --api-disable-download-from
      - --webhook-disable
      - --chromium-disable-routes
      - --pdfengines-disable-routes
      - --api-timeout=300s
    networks: [gotenberg]
    ports: ["127.0.0.1:${ROR_GOTENBERG_PORT:-3300}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health"]
      interval: 10s
      retries: 10
  gotenberg-drafts:
    profiles: [full]
    image: ${REGISTRY_MIRROR:-}gotenberg/gotenberg:8.20.1
    # paper-draft Markdown -> PDF: chromium enabled (ROR_DRAFT_GOTENBERG_URL=http://localhost:3301), office off
    command:
      - gotenberg
      - --api-disable-download-from
      - --webhook-disable
      - --pdfengines-disable-routes
      - --libreoffice-disable-routes
      - --api-timeout=120s
    networks: [gotenberg]
    ports: ["127.0.0.1:${ROR_GOTENBERG_DRAFTS_PORT:-3301}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health"]
      interval: 10s
      retries: 10
  clamav:
    profiles: [full]
    image: ${REGISTRY_MIRROR:-}clamav/clamav:1.4
    environment:
      # fail closed: limits exceed the 500 MB upload cap; anything over a limit is reported FOUND
      CLAMD_CONF_StreamMaxLength: 600M
      CLAMD_CONF_MaxFileSize: 600M
      CLAMD_CONF_MaxScanSize: 600M
      CLAMD_CONF_AlertExceedsMax: "yes"
    ports: ["3310:3310"]
networks:
  # dedicated (not `internal`: Docker would not publish its port to the host); prod uses NetworkPolicy
  gotenberg: {}

volumes:
  esdata:
  pgdata:
  miniodata:
