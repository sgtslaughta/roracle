{{- if eq .Values.elasticsearch.mode "eck" }}
{{- $es := .Values.elasticsearch }}
{{- $sn := $es.snapshot }}
{{- $snEp := $sn.endpoint }}
{{- if $sn.enabled }}
{{- $_ := required "elasticsearch.snapshot.credentialsSecret is required when snapshots are enabled" $sn.credentialsSecret }}
{{- $_ := required "elasticsearch.snapshot.endpoint (host:port, no scheme) is required when snapshots are enabled" $sn.endpoint }}
{{- end }}
{{- $caSnap := and $sn.enabled (eq (include "roracle.snapProtocol" .) "https") $sn.extraCASecret.name }}
{{- $img := merge (deepCopy $es.image) (dict "tag" $es.version) }}
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: {{ include "roracle.fullname" . }}
  labels: {{ include "roracle.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  version: {{ $es.version | quote }}
  {{- if .Values.global.imageRegistry }}
  image: {{ include "roracle.dataImage" (dict "root" . "img" $img) }}
  {{- end }}
  http:
    tls:
      selfSignedCertificate:
        disabled: {{ not $es.tls }}
  auth:
    fileRealm:
      - secretName: {{ required "elasticsearch.appUserSecret is required when elasticsearch.mode=eck" $es.appUserSecret | quote }}
    roles:
      - secretName: {{ include "roracle.fullname" . }}-es-roles
  {{- if $sn.enabled }}
  secureSettings:
    - secretName: {{ $sn.credentialsSecret | quote }}
  {{- end }}
  nodeSets:
    {{- range $ns := $es.nodeSets }}
    - name: {{ $ns.name }}
      count: {{ $ns.count }}
      config:
        node.roles: {{ toJson $ns.roles }}
        {{- if $sn.enabled }}
        s3.client.default.endpoint: {{ $snEp | quote }}
        s3.client.default.protocol: {{ include "roracle.snapProtocol" $ | quote }}
        s3.client.default.path_style_access: {{ $sn.pathStyleAccess }}
        {{- end }}
        {{- with $es.extraConfig }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      podTemplate:
        spec:
          automountServiceAccountToken: false
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets: {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          {{- if $caSnap }}
          initContainers:
            - name: truststore
              imagePullPolicy: {{ $es.image.pullPolicy }}
              command: [sh, -ec]
              args:
                - |
                  J=/usr/share/elasticsearch/jdk
                  cp $J/lib/security/cacerts /trust/cacerts && chmod u+w /trust/cacerts
                  for f in /ca/*.crt; do [ ! -f "$f" ] || $J/bin/keytool -importcert -noprompt -alias "$(basename $f)" -file "$f" -keystore /trust/cacerts -storepass changeit; done
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: trust, mountPath: /trust}
                - {name: snap-ca, mountPath: /ca, readOnly: true}
          volumes:
            - name: trust
              emptyDir: {sizeLimit: 2Mi}
            - name: snap-ca
              projected:
                sources:
                  {{- with $sn.extraCASecret.name }}
                  - secret: {name: {{ . | quote }}, items: [{key: {{ default "ca.crt" $sn.extraCASecret.key | quote }}, path: extra.crt}]}
                  {{- end }}
          {{- end }}
          containers:
            - name: elasticsearch
              imagePullPolicy: {{ $es.image.pullPolicy }}
              {{- if $caSnap }}
              env:
                - {name: ES_JAVA_OPTS, value: "-Djavax.net.ssl.trustStore=/trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"}
              volumeMounts:
                - {name: trust, mountPath: /trust, readOnly: true}
              {{- end }}
              resources: {{ toYaml $es.resources | nindent 16 }}
      volumeClaimTemplates:
        - metadata: {name: elasticsearch-data}
          spec:
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: {{ $es.storage.size }}}}
            {{- with $es.storage.storageClass }}
            storageClassName: {{ . }}
            {{- end }}
    {{- end }}
---
# Non-sensitive role for the app user; the user itself (fileRealm) is the operator-supplied appUserSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roracle.fullname" . }}-es-roles
  labels: {{ include "roracle.labels" . | nindent 4 }}
stringData:
  roles.yml: |
    roracle_app:
      cluster: [monitor]
      indices:
        - names: ["chunks*"]
          privileges: [create_index, manage, read, write, view_index_metadata]
{{- end }}
