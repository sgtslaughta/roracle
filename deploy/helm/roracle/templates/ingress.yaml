{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
{{- $fn := include "roracle.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}
  labels: {{ include "roracle.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - {path: /mcp, pathType: Exact, backend: {service: {name: {{ $fn }}-api, port: {number: 8000}}}}
          - {path: /.well-known/oauth-protected-resource, pathType: Prefix, backend: {service: {name: {{ $fn }}-api, port: {number: 8000}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: {{ $fn }}-web, port: {number: 8080}}}}
{{- end }}
