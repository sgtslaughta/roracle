{{- /* Optional parser Deployments + Services (gotenberg, docling, grobid, clamav). Only the worker calls them. */ -}}
{{- $root := . }}
{{- range $name := list "gotenberg" "docling" "grobid" "clamav" }}
{{- $v := get $root.Values.parsers $name }}
{{- if $v.enabled }}
{{- $fn := printf "%s-%s" (include "roracle.fullname" $root) $name }}
{{- $sel := include "roracle.selector" (dict "root" $root "comp" $name) }}
{{- $uid := $v.runAsUser }}
{{- $gid := default $uid $v.runAsGroup }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}
  labels: {{ include "roracle.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels: {{ $sel | nindent 6 }}
  template:
    metadata:
      labels: {{ include "roracle.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "roracle.saName" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ $uid }}
        runAsGroup: {{ $gid }}
        fsGroup: {{ $gid }}
      {{- include "roracle.pullSecrets" $root | nindent 6 }}
      {{- if and $root.Values.topologySpread.enabled (gt (int $v.replicas) 1) }}
      topologySpreadConstraints:
        {{- range $key := list "topology.kubernetes.io/zone" "kubernetes.io/hostname" }}
        - maxSkew: 1
          topologyKey: {{ $key }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{ $sel | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- if $v.seedDir }}
      initContainers:
        - name: seed
          image: {{ include "roracle.dataImage" (dict "root" $root "img" $v.image) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: [sh, -ec, 'cp -a {{ $v.seedDir }}/. /seed/']
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: w0, mountPath: /seed}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "roracle.dataImage" (dict "root" $root "img" $v.image) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- with $v.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- $env := dict }}
          {{- if eq $name "clamav" }}
          {{- if $v.mirrorUrl }}{{ $_ := set $env "FRESHCLAM_CONF_PrivateMirror" $v.mirrorUrl }}{{ else }}{{ $_ := set $env "CLAMAV_NO_FRESHCLAMD" "true" }}{{ end }}
          {{- end }}
          {{- $env = merge $env (deepCopy $v.env) }}
          {{- if $env }}
          env:
            {{- range $k := keys $env | sortAlpha }}
            - {name: {{ $k }}, value: {{ get $env $k | toString | quote }}}
            {{- end }}
          {{- end }}
          ports:
            - {name: tcp, containerPort: {{ $v.port }}}
          {{- if $v.probe.tcp }}
          startupProbe: {tcpSocket: {port: tcp}, periodSeconds: 10, failureThreshold: 90}
          readinessProbe: {tcpSocket: {port: tcp}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: tcp}, periodSeconds: 20, failureThreshold: 6}
          {{- else }}
          startupProbe: {httpGet: {path: {{ $v.probe.path }}, port: tcp}, periodSeconds: 10, failureThreshold: 60}
          readinessProbe: {httpGet: {path: {{ $v.probe.path }}, port: tcp}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: {{ $v.probe.path }}, port: tcp}, periodSeconds: 20, failureThreshold: 6}
          {{- end }}
          resources: {{ toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- $sc := deepCopy $root.Values.containerSecurityContext }}{{ $_ := set $sc "readOnlyRootFilesystem" $v.readOnlyRootFilesystem }}
            {{- toYaml $sc | nindent 12 }}
          {{- with $v.writableDirs }}
          volumeMounts:
            {{- range $i, $d := . }}
            - {name: w{{ $i }}, mountPath: {{ $d.path }}}
            {{- end }}
          {{- end }}
      {{- with $v.writableDirs }}
      volumes:
        {{- range $i, $d := . }}
        - name: w{{ $i }}
          emptyDir: {sizeLimit: {{ $d.size }}}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}
  labels: {{ include "roracle.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector: {{ $sel | nindent 4 }}
  ports:
    - {name: tcp, port: {{ $v.port }}, targetPort: tcp}
{{- if and $root.Values.parsers.pdb.enabled (gt (int $v.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}
  labels: {{ include "roracle.labels" $root | nindent 4 }}
spec:
  minAvailable: {{ $root.Values.parsers.pdb.minAvailable }}
  selector:
    matchLabels: {{ $sel | nindent 6 }}
{{- end }}
---
{{- end }}
{{- end }}
