{{- /* App-tier NetworkPolicies: default-deny for every pod in the namespace + explicit allows (policies are additive).
Data-tier policies and helpers (roracle.npDns, roracle.npS3Egress, roracle.nsPeer): networkpolicy-data.yaml.
Parser callers: the worker (ingest pipeline + evidence scan handlers); the api calls only draftgotenberg (draft PDF builds). */ -}}
{{- /* single-line podSelector for release pods whose component is in .comps. args: root, comps */ -}}
{{- define "roracle.npPods" -}}
podSelector: {matchLabels: {app.kubernetes.io/name: {{ .root.Chart.Name }}, app.kubernetes.io/instance: {{ .root.Release.Name | quote }}}, matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [{{ join ", " .comps }}]}]}
{{- end -}}
{{- /* egress rule to CIDRs and/or one in-cluster peer (namespaceSelector + podSelector in one item = AND); nothing when
all empty (an empty `to` would mean "anywhere"). args: cidrs, ports, namespaceSelector?, podSelector? */ -}}
{{- define "roracle.npCidrRule" -}}
{{- if or .cidrs .namespaceSelector .podSelector }}
- to:
    {{- range .cidrs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    {{- if or .namespaceSelector .podSelector }}
    - {  {{- if .namespaceSelector }}namespaceSelector: {matchLabels: {{ toJson .namespaceSelector }}}{{ if .podSelector }}, {{ end }}{{ end }}{{ if .podSelector }}podSelector: {matchLabels: {{ toJson .podSelector }}}{{ end }}}
    {{- end }}
  ports: [{{ range $i, $p := .ports }}{{ if $i }}, {{ end }}{port: {{ $p }}, protocol: TCP}{{ end }}]
{{- end }}
{{- end -}}
{{- define "roracle.npPgEgress" -}}
{{- if eq .Values.postgres.mode "cnpg" }}
- to: [{podSelector: {matchLabels: {cnpg.io/cluster: {{ printf "%s-pg" (include "roracle.fullname" .) | quote }}}}}]
  ports: [{port: 5432, protocol: TCP}]
{{- if .Values.postgres.pooler.enabled }}
- to: [{podSelector: {matchLabels: {cnpg.io/poolerName: {{ printf "%s-pg-pooler-rw" (include "roracle.fullname" .) | quote }}}}}]
  ports: [{port: 5432, protocol: TCP}]
{{- end }}
{{- else }}
{{- include "roracle.npCidrRule" .Values.networkPolicy.externalCIDRs.postgres }}
{{- end }}
{{- end -}}
{{- define "roracle.npEsEgress" -}}
{{- if eq .Values.elasticsearch.mode "eck" }}
- to: [{podSelector: {matchLabels: {elasticsearch.k8s.elastic.co/cluster-name: {{ include "roracle.fullname" . | quote }}}}}]
  ports: [{port: 9200, protocol: TCP}]
{{- else }}
{{- include "roracle.npCidrRule" .Values.networkPolicy.externalCIDRs.elasticsearch }}
{{- end }}
{{- end -}}
{{- define "roracle.npMeta" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "roracle.fullname" .root }}-{{ .name }}
  labels: {{ include "roracle.labels" .root | nindent 4 }}
{{- end -}}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $fn := include "roracle.fullname" . }}
{{- $root := . }}
{{- if and .Values.parsers.clamav.enabled .Values.parsers.clamav.mirrorUrl (not .Values.parsers.clamav.mirrorCIDRs) }}{{ fail "parsers.clamav.mirrorCIDRs is required when parsers.clamav.mirrorUrl is set (egress to the mirror is otherwise denied)" }}{{ end }}
{{- $w := include "roracle.npPods" (dict "root" . "comps" (list "worker")) }}
{{- $api := include "roracle.npPods" (dict "root" . "comps" (list "api")) }}
{{- $web := include "roracle.npPods" (dict "root" . "comps" (list "web")) }}
{{- /* DNS for everything except parsers (zero egress). clamav gets DNS only when it must resolve the freshclam mirror. */}}
{{- $noDns := list "gotenberg" "draftgotenberg" "docling" "grobid" }}
{{- if not .Values.parsers.clamav.mirrorUrl }}{{ $noDns = append $noDns "clamav" }}{{ end }}
{{ include "roracle.npMeta" (dict "root" . "name" "default-deny") }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{ include "roracle.npMeta" (dict "root" . "name" "allow-dns") }}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/component, operator: NotIn, values: [{{ join ", " $noDns }}]}]}
  policyTypes: [Egress]
  egress:
    {{- include "roracle.npDns" .Values | nindent 4 }}
{{- if .Values.ingress.enabled }}
{{- range $c, $port := dict "web" 8080 "api" 8000 }}
---
{{ include "roracle.npMeta" (dict "root" $root "name" (printf "ingress-to-%s" $c)) }}
spec:
  {{ include "roracle.npPods" (dict "root" $root "comps" (list $c)) }}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {{ toJson $np.ingressNamespaceSelector }}}}]
      ports: [{port: {{ $port }}, protocol: TCP}]
{{- end }}
{{- end }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "api-from-web") }}
spec:
  {{ $api }}
  policyTypes: [Ingress]
  ingress:
    - from: [{ {{- $web -}} }]
      ports: [{port: 8000, protocol: TCP}]
---
{{ include "roracle.npMeta" (dict "root" . "name" "web-to-api") }}
spec:
  {{ $web }}
  policyTypes: [Egress]
  egress:
    - to: [{ {{- $api -}} }]
      ports: [{port: 8000, protocol: TCP}]
{{- /* api/worker/migrate -> data tier: bundled = pod selectors, external = CIDRs (externalCIDRs, s3Cidrs) */}}
{{- $data := print (include "roracle.npPgEgress" .) (include "roracle.npEsEgress" .) (include "roracle.npS3Egress" .) }}
{{- if $data }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "app-egress-data") }}
spec:
  {{ include "roracle.npPods" (dict "root" . "comps" (list "api" "worker" "migrate")) }}
  policyTypes: [Egress]
  egress: {{ $data | nindent 4 }}
{{- end }}
{{- if eq .Values.elasticsearch.mode "eck" }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "es-snapshot-egress") }}
spec:
  {{ include "roracle.npPods" (dict "root" . "comps" (list "es-snapshot")) }}
  policyTypes: [Egress]
  egress: {{ include "roracle.npEsEgress" . | nindent 4 }}
{{- end }}
{{- if eq .Values.minio.mode "tenant" }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "minio-policy-egress") }}
spec:
  {{ include "roracle.npPods" (dict "root" . "comps" (list "minio-policy")) }}
  policyTypes: [Egress]
  egress: {{ include "roracle.npS3Egress" . | nindent 4 }}
{{- end }}
{{- /* api + worker -> inference (LLM), OIDC (JWKS), OTLP collector */}}
{{- $ext := print (include "roracle.npCidrRule" $np.egressCIDRs.llm) (include "roracle.npCidrRule" $np.egressCIDRs.oidc) (include "roracle.npCidrRule" $np.egressCIDRs.otel) }}
{{- if $ext }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "app-egress-external") }}
spec:
  {{ include "roracle.npPods" (dict "root" . "comps" (list "api" "worker")) }}
  policyTypes: [Egress]
  egress: {{ $ext | nindent 4 }}
{{- end }}
{{- /* worker -> enabled parsers and connector CIDRs */}}
{{- $weg := print (include "roracle.npCidrRule" (dict "cidrs" .Values.connectors.egressCIDRs "ports" .Values.connectors.ports)) (include "roracle.npCidrRule" $np.egressCIDRs.parsers) }}
{{- range $p := list "gotenberg" "docling" "grobid" "clamav" }}{{ $v := get $.Values.parsers $p }}{{ if $v.enabled }}
{{- $weg = printf "%s\n- to: [{%s}]\n  ports: [{port: %v, protocol: TCP}]" $weg (include "roracle.npPods" (dict "root" $root "comps" (list $p))) $v.port }}
{{- end }}{{ end }}
{{- if $weg | trim }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "worker-egress") }}
spec:
  {{ $w }}
  policyTypes: [Egress]
  egress: {{ $weg | trim | nindent 4 }}
{{- end }}
{{- /* parsers: ingress from the worker only; policyTypes lists Egress with NO egress rules (deny all),
only clamav may reach its freshclam mirror CIDRs (443/80) when parsers.clamav.mirrorUrl is set. */}}
{{- if .Values.parsers.draftgotenberg.enabled }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "api-egress-draft") }}
spec:
  {{ $api }}
  policyTypes: [Egress]
  egress:
    - to: [{ {{- include "roracle.npPods" (dict "root" . "comps" (list "draftgotenberg")) -}} }]
      ports: [{port: {{ .Values.parsers.draftgotenberg.port }}, protocol: TCP}]
{{- end }}
{{- range $p := list "gotenberg" "draftgotenberg" "docling" "grobid" "clamav" }}{{ $v := get $.Values.parsers $p }}{{ if $v.enabled }}
---
{{ include "roracle.npMeta" (dict "root" $root "name" (printf "parser-%s" $p)) }}
spec:
  {{ include "roracle.npPods" (dict "root" $root "comps" (list $p)) }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ {{- ternary $api $w (eq $p "draftgotenberg") -}} }]
      ports: [{port: {{ $v.port }}, protocol: TCP}]
  {{- if and (eq $p "clamav") $v.mirrorUrl }}
  {{- with include "roracle.npCidrRule" (dict "cidrs" $v.mirrorCIDRs "ports" (list 443 80)) | trim }}
  egress: {{ . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}{{ end }}
{{- if $np.scrape.enabled }}
---
{{ include "roracle.npMeta" (dict "root" . "name" "allow-scrape") }}
spec:
  {{ include "roracle.npPods" (dict "root" . "comps" (list "api" "worker")) }}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}}}}]
      ports: [{{ range $i, $p := $np.scrape.ports }}{{ if $i }}, {{ end }}{port: {{ $p }}, protocol: TCP}{{ end }}]
{{- end }}
{{- end }}
