{{- /* Data-tier policies, always rendered for bundled modes. Labels: ECK elasticsearch.k8s.elastic.co/cluster-name,
CNPG cnpg.io/cluster. App pods: roracle.appPeer. */ -}}
{{- $np := .Values.networkPolicy }}
{{- $fn := include "roracle.fullname" . }}
{{- $esOn := eq .Values.elasticsearch.mode "eck" }}
{{- $pgOn := eq .Values.postgres.mode "cnpg" }}
{{- $pgSel := dict "cnpg.io/cluster" (printf "%s-pg" $fn) }}
{{- $esSel := dict "elasticsearch.k8s.elastic.co/cluster-name" $fn }}
{{- define "roracle.npDns" }}
- to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .networkPolicy.dns.namespace | quote }}}}
      podSelector: {matchLabels: {{ toJson .networkPolicy.dns.podLabels }}}
  ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
{{- define "roracle.npKubeApi" }}
- {{ with .networkPolicy.kubeAPI.cidrs }}to: {{ range . }}
    - ipBlock: {cidr: {{ . | quote }}}
  {{- end }}
  {{ end }}ports: [{{ range $i, $p := .networkPolicy.kubeAPI.ports }}{{ if $i }}, {{ end }}{port: {{ $p }}, protocol: TCP}{{ end }}]
{{- end }}
{{- /* egress to object storage (external S3): CIDRs and/or an in-cluster peer (e.g. Rook-Ceph RGW), see networkPolicy.s3 */ -}}
{{- define "roracle.npS3Egress" }}
{{- include "roracle.npCidrRule" .Values.networkPolicy.s3 }}
{{- end }}
{{- if $esOn }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-data-es
  labels: {{ include "roracle.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {{ toJson $esSel }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "roracle.appPeer" . | nindent 8 }}
        {{- include "roracle.nsPeer" $np.operatorNamespaces.eck | nindent 8 }}
      ports: [{port: 9200, protocol: TCP}]
    - from: [{podSelector: {matchLabels: {{ toJson $esSel }}}}]
      ports: [{port: 9300, protocol: TCP}, {port: 9200, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {{ toJson $esSel }}}}]
      ports: [{port: 9300, protocol: TCP}, {port: 9200, protocol: TCP}]
    {{- include "roracle.npS3Egress" . | nindent 4 }}
    {{- include "roracle.npDns" .Values | nindent 4 }}
---
{{- end }}
{{- if $pgOn }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-data-pg
  labels: {{ include "roracle.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {{ toJson $pgSel }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "roracle.appPeer" . | nindent 8 }}
        - podSelector: {matchLabels: {{ toJson $pgSel }}}
        {{- if .Values.postgres.pooler.enabled }}
        - podSelector: {matchLabels: {cnpg.io/poolerName: {{ printf "%s-pg-pooler-rw" $fn | quote }}}}
        {{- end }}
      ports: [{port: 5432, protocol: TCP}]
    - from:
        {{- include "roracle.nsPeer" $np.operatorNamespaces.cnpg | nindent 8 }}
      ports: [{port: 8000, protocol: TCP}]
    - from:
        {{- include "roracle.nsPeer" $np.monitoringNamespace | nindent 8 }}
      ports: [{port: 9187, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {{ toJson $pgSel }}}}]
      ports: [{port: 5432, protocol: TCP}]
    {{- include "roracle.npS3Egress" . | nindent 4 }}
    {{- include "roracle.npKubeApi" .Values | nindent 4 }}
    {{- include "roracle.npDns" .Values | nindent 4 }}
---
{{- if .Values.postgres.pooler.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-data-pg-pooler
  labels: {{ include "roracle.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {cnpg.io/poolerName: {{ printf "%s-pg-pooler-rw" $fn | quote }}}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "roracle.appPeer" . | nindent 8 }}
      ports: [{port: 5432, protocol: TCP}]
    - from:
        {{- include "roracle.nsPeer" $np.operatorNamespaces.cnpg | nindent 8 }}
      ports: [{port: 8000, protocol: TCP}]
    - from:
        {{- include "roracle.nsPeer" $np.monitoringNamespace | nindent 8 }}
      ports: [{port: 9127, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {{ toJson $pgSel }}}}]
      ports: [{port: 5432, protocol: TCP}]
    {{- include "roracle.npKubeApi" .Values | nindent 4 }}
    {{- include "roracle.npDns" .Values | nindent 4 }}
---
{{- end }}
{{- end }}
