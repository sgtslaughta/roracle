[project]
name = "roracle"
version = "0.1.0"
description = "rOracle air-gapped research-paper RAG backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "alembic",
  "pydantic-settings",
  "pyjwt[crypto]",
  "httpx",
  "boto3",
  "python-multipart",
  "openai>=3.51.0",
  "elasticsearch>=8.15,<9",
  "docling-core[chunking]>=2.107.0",
  "datasketch>=2.0.0",
  "lxml>=6.1.3",
  "rapidfuzz>=3.14.6",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roracle"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the dev stack (Keycloak, Elasticsearch, Postgres, MinIO)",
  "e2e: real MinIO/Docling/Elasticsearch/model endpoint; runs only with ROR_E2E=1",
]
