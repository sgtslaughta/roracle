[project]
name = "roracle"
version = "0.1.0"
description = "rOracle air-gapped research-paper RAG backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "alembic",
  "pydantic-settings",
  "pyjwt[crypto]",
  "httpx",
  "boto3",
  "python-multipart",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roracle"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the dev stack (Keycloak)"]
